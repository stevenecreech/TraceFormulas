name: Publish website

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

defaults:
  run:
    working-directory: traceformulas-vscode

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: traceformulas-vscode/requirements.txt
      - name: Install converter
        run: python -m pip install -r requirements.txt
      - name: Install TeX
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends texlive-latex-base texlive-latex-recommended texlive-latex-extra lmodern
      - name: Check source pipeline
        run: python -m unittest discover -s tests -v
      - name: Build website and PDF
        run: python scripts/build.py --pdf
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload website
        uses: actions/upload-pages-artifact@v3
        with:
          path: traceformulas-vscode/dist
      - name: Publish
        id: deployment
        uses: actions/deploy-pages@v4
